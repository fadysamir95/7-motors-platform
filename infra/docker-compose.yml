services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motors
      POSTGRES_PASSWORD: motors
      POSTGRES_DB: motors
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motors -d motors"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
